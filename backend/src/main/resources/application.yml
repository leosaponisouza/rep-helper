server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: rephelper-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/rephelper}
    username: ${SPRING_DATASOURCE_USERNAME:rephelper}
    password: ${SPRING_DATASOURCE_PASSWORD:rephelper_dev_password}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 300000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 20
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:*}
  jwt:
    secret: ${JWT_SECRET:rephelper-dev-secret-change-in-production-minimum-256-bits-key}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:2592000000}
  media:
    storage-root: ${MEDIA_STORAGE_ROOT:./media_data}
    max-bytes: 5242880
  google:
    client-ids: ${GOOGLE_CLIENT_IDS:}
  email:
    provider-url: ${EMAIL_PROVIDER_URL:https://api.resend.com/emails}
    api-key: ${EMAIL_PROVIDER_API_KEY:}
    from-address: ${EMAIL_FROM_ADDRESS:no-reply@rephelper.local}

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSZ} %-5level [%X{requestId:-none}] [%X{userId:-anon}] %logger{36} - %msg%n"
