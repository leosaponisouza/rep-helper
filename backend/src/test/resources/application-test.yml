spring:
  datasource:
    url: jdbc:h2:mem:rephelper_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

app:
  public-base-url: http://localhost:8080
  jwt:
    secret: rephelper-integration-test-jwt-secret-key-at-least-256-bits-long
    access-expiration-ms: 1800000
    refresh-expiration-ms: 2592000000
  email:
    api-key: ""
